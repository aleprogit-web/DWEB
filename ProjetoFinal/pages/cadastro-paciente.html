
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="tela">

    <aside class="sidebar">
        <div class="logo">
           <img src="../assets/imagens/liga-logo.png">
        </div>

        <nav>
            <a href="../pages/home.html">
                <i class="fa-solid fa-house"></i><span>Home</span>
            </a>

            <a href="../pages/paciente.html" class="ativo">
                <i class="fa-solid fa-user"></i><span>Pacientes</span>
            </a>

            <a href="../pages/profissional.html">
                <i class="fa-solid fa-user-doctor"></i><span>Profissionais</span>
            </a>

            <a href="#"><i class="fa-solid fa-calendar-days"></i><span>Agendamentos</span></a>
            <a href="#"><i class="fa-solid fa-box"></i><span>Estoque</span></a>
            <a href="#"><i class="fa-solid fa-truck"></i><span>Fornecedores</span></a>
            <a href="#"><i class="fa-solid fa-chart-column"></i><span>Relatórios</span></a>
        </nav>
    </aside>

    <main class="conteudo">
        <header class="topo">

            <button
                type="button"
                class="btn-voltar">
                <a href="../pages/paciente.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Voltar</span>
                </a>
            </button>

            <div class="usuario">
                <span>Olá, Admin</span>
                <i class="fa-solid fa-circle-user"></i>
                <i class="fa-solid fa-gear"></i>
            </div>
        </header>

        <section class="pagina-cadastro">
            <div class="cabecalho-cadastro">
                <h1>Cadastro de paciente</h1>
                <p>Preencha os dados pessoais e as informações clínicas.</p>
            </div>

            <form class="formulario formulario-paciente" id="formulario">

                <section class="secao-cadastro">
                    <div class="titulo-secao">
                        <i class="fa-solid fa-user"></i>
                        <div>
                            <h2>Dados pessoais</h2>
                            <p>Informações de identificação e contato.</p>
                        </div>
                    </div>

                    <div class="grade-campos">
                        <div class="campo-cadastro campo-largo">
                            <label class="obrigatorio" for="nome">Nome completo *</label>
                            <input type="text" id="nome" required>
                        </div>

                        <div class="campo-cadastro campo-largo">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco">
                        </div>

                        <div class="campo-cadastro">
                            <label for="numero">Número</label>
                            <input type="text" id="numero">
                        </div>

                        <div class="campo-cadastro">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade">
                        </div>

                        <div class="campo-cadastro">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" maxlength="2">
                        </div>

                        <div class="campo-cadastro">
                            <label class="obrigatorio" for="celular">Celular *</label>
                            <input type="tel" id="celular">
                        </div>

                        <div class="campo-cadastro">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf">
                        </div>

                        <div class="campo-cadastro">
                            <label for="nascimento">Data de nascimento</label>
                            <input type="date" id="nascimento">
                        </div>

                        <div class="campo-cadastro campo-largo">
                            <label class="obrigatorio" for="email">E-mail *</label>
                            <input type="email" id="email">
                        </div>
                    </div>
                </section>

                <section class="secao-cadastro">
                    <div class="titulo-secao">
                        <i class="fa-solid fa-notes-medical"></i>
                        <div>
                            <h2>Informações clínicas</h2>
                            <p>Dados do convênio e observações do paciente.</p>
                        </div>
                    </div>

                    <div class="grade-campos">
                        <div class="campo-cadastro">
                            <label for="convenio">Convênio</label>
                            <input type="text" id="convenio">
                        </div>

                        <div class="campo-cadastro">
                            <label for="plano">Plano</label>
                            <input type="text" id="plano">
                        </div>

                        <div class="campo-cadastro">
                            <label for="carteirinha">Nº da carteirinha</label>
                            <input type="text" id="carteirinha">
                        </div>

                        <div class="campo-cadastro">
                            <label for="validade">Validade do convênio</label>
                            <input type="date" id="validade">
                        </div>

                        <div class="campo-cadastro campo-largo">
                            <label for="observacoes">Observações sobre o paciente</label>
                            <textarea id="observacoes" rows="4"
                                      placeholder="Registre informações clínicas relevantes..."></textarea>
                        </div>
                    </div>
                </section>

                <div class="botoes-cadastro">
                    <a href="../pages/paciente.html" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-salvar">
                        <i class="fa-solid fa-check"></i> Salvar paciente
                    </button>
                </div>

            </form>
        </section>
    </main>
</div>

<script src="../js/cadastro-paciente.js"></script>
</body>
</html>
