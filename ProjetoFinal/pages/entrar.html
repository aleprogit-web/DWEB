
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Clínica</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../js/autenticacao.js" defer></script>
</head>
<body class="pagina-login">

    <main class="card-acesso card-entrar">

        <a href="../pages/index.html" class="voltar-login">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>

        <div class="logo-login">
            <img src="../assets/imagens/liga-logo.png" alt="Logo da Liga Sorocabana de Combate ao Câncer">
        </div>

        <h1>Fazer login</h1>
        <p class="descricao-login">
            Entre com os dados da sua conta.
        </p>

        <form class="form-login" id="form-login">

            <div class="campo-login">
                <label for="email">E-mail</label>

                <div class="input-icone">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@gmail.com"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="campo-login">
                <label for="senha">Senha</label>

                <div class="input-icone">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <div class="esqueceu-senha">
                <a href="../pages/recuperar-senha.html">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-entrar">
                Entrar
            </button>

        </form>

        <p class="rodape-login">Sistema de gerenciamento da clínica</p>

    </main>

    <script>

        const form = document.getElementById('form-login');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            const resultado = fazerLogin(email, senha);

            if (!resultado.sucesso) {
                alert(resultado.mensagem);
                return;
            }

            window.location.href = '../pages/home.html';
        });

    
</script>

</body>
</html>
