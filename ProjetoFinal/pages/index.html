<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | Clínica</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="pagina-login">

    <main class="card-acesso">

        <div class="logo-login">
            <img src="../assets/imagens/liga-logo.png" alt="Logo da Liga Sorocabana de Combate ao Câncer">
        </div>

        <h1>Bem-vindo!</h1>
        <p class="descricao-login">
            Acesse o sistema de gerenciamento da clínica.
        </p>

        <div class="opcoes-acesso">

            <a href="../pages/entrar.html" class="opcao-login">
                <span class="icone-opcao">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </span>

                <span class="texto-opcao">
                    <strong>Entrar em uma conta</strong>
                    <small>Acesse com seu e-mail e senha.</small>
                </span>

                <i class="fa-solid fa-chevron-right seta-opcao"></i>
            </a>

            <a href="../pages/cadastro-acesso.html" class="opcao-login">
                <span class="icone-opcao">
                    <i class="fa-solid fa-user-plus"></i>
                </span>

                <span class="texto-opcao">
                    <strong>Criar novo acesso</strong>
                    <small>Cadastre um novo usuário.</small>
                </span>

                <i class="fa-solid fa-chevron-right seta-opcao"></i>
            </a>

        </div>

        <p class="rodape-login">Sistema de gerenciamento da clínica</p>

    </main>

</body>
</html>
