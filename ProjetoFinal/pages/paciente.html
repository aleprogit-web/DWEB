<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pacientes</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="pagina-pacientes">

    <div class="tela">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo" aria-label="Logo da clínica">
                <img src="../assets/imagens/liga-logo.png">
            </div>

            <nav aria-label="Menu principal">

                <a href="../pages/home.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="../pages/paciente.html" class="ativo" aria-current="page">
                    <i class="fa-solid fa-user"></i>
                    <span>Pacientes</span>
                </a>

                <a href="../pages/profissional.html">
                    <i class="fa-solid fa-user-doctor"></i>
                    <span>Profissionais</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Agendamentos</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-box"></i>
                    <span>Estoque</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-truck"></i>
                    <span>Fornecedores</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Relatórios</span>
                </a>

            </nav>

            

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo">

            <!-- CABEÇALHO SUPERIOR -->
            <header class="topo">

                <div class="topo-esquerda">

                    <button
                        type="button"
                        class="btn-menu"
                        aria-label="Menu lateral"
                        title="Menu lateral"
                    >
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <button
                        type="button"
                        class="btn-voltar">
                        <a href="../pages/home.html">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Voltar</span>
                        </a>
                    </button>

                </div>

                <div class="usuario">

                    <button
                        type="button"
                        class="btn-notificacao"
                        aria-label="Notificações"
                    >
                        <i class="fa-regular fa-bell"></i>
                    </button>

                    <div class="usuario-perfil">
                        <i class="fa-solid fa-circle-user"></i>

                        <span>Olá, Admin</span>

                        <i class="fa-solid fa-chevron-down"></i>
                    </div>

                    <button
                        type="button"
                        class="btn-configuracoes"
                        aria-label="Configurações"
                    >
                        <i class="fa-solid fa-gear"></i>
                    </button>

                </div>

            </header>


            <!-- TÍTULO E AÇÕES DA PÁGINA -->
            <section class="cabecalho-pagina">

                <div class="titulo-pagina">
                    <div class="icone-titulo">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <div class="titulo-pagina-texto">
                        <h1>Pacientes</h1>
                        <p>Gerencie os pacientes cadastrados no sistema.</p>
                    </div>
                </div>

                <div class="acoes">

                    <label class="campo-pesquisa" for="pesquisa">
                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="search"
                            id="pesquisa"
                            placeholder="Pesquise por nome, telefone, CPF..."
                            autocomplete="off"
                        >
                    </label>

                    <a
                        href="../pages/cadastro-paciente.html"
                        class="btn-novo"
                    >
                        <i class="fa-solid fa-plus"></i>
                        <span>Novo Paciente</span>
                    </a>

                </div>

            </section>


            <!-- LISTA DE PACIENTES -->
            <section class="painel-pacientes">

                <div class="painel-pacientes-topo">
                    <h2>Lista de Pacientes</h2>
                </div>

                <div
                    class="lista-pacientes"
                    id="lista-pacientes"
                    aria-live="polite"
                >

                    <div class="cabecalho-lista">
                        <span>Nome</span>
                        <span>Ações</span>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Caixa de confirmação de exclusão -->
<div class="modal-overlay" id="modal-exclusao" hidden>
    <div class="modal-exclusao" role="dialog" aria-modal="true"
         aria-labelledby="titulo-exclusao">

        <div class="icone-exclusao">
            <i class="fa-solid fa-trash-can"></i>
        </div>

        <h2 id="titulo-exclusao">Excluir paciente?</h2>

        <p>
            Tem certeza de que deseja excluir
            <strong id="nome-exclusao">este paciente</strong>?<br>
            Essa ação não poderá ser desfeita.
        </p>

        <div class="botoes-exclusao">
            <button type="button" class="btn-modal-cancelar"
                    id="cancelar-exclusao">
                Cancelar
            </button>

            <button type="button" class="btn-modal-excluir"
                    id="confirmar-exclusao">
                Excluir paciente
            </button>
        </div>

    </div>
</div>

    <script src="../js/paciente.js"></script>

</body>
</html>
