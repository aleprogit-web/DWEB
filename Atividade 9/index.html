  <p>Adicionar 3 números e mostra na ordem crescente:</p>

  <p>Adicione uma palavra</p>

  <button class="palin">Palíndromo</button>

  <p>Adicione duas palavras e veja se é subconjunto</p>

  <p>Adicione uma data e retorna o dia da semana</p>
